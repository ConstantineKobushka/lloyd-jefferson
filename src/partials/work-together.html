<section class="work-together section" id="work-together">
  <div class="container">
    <div class="work-together-top">
      <picture class="work-together-picture">
        <source
          media="(min-width: 768px)"
          srcset="
            /img/work-together/work-together-desktop-logo.webp    1x,
            /img/work-together/work-together-desktop-logo@2x.webp 2x
          "
          type="image/webp"
        />
        <source
          media="(min-width: 768px)"
          srcset="
            /img/work-together/work-together-desktop-logo.jpg    1x,
            /img/work-together/work-together-desktop-logo@2x.jpg 2x
          "
          type="image/jpg"
        />
        <source
          media="(min-width: 320px)"
          srcset="
            /img/work-together/work-together-mobile-logo.webp    1x,
            /img/work-together/work-together-mobile-logo@2x.webp 2x
          "
          type="image/webp"
        />
        <source
          media="(min-width: 320px)"
          srcset="
            /img/work-together/work-together-mobile-logo.jpg    1x,
            /img/work-together/work-together-mobile-logo@2x.jpg 2x
          "
          type="image/jpg"
        />
        <img
          class="work-together-img"
          src="/img/work-together/work-together-desktop-logo.jpg"
          alt="Lloyd Jefferson"
          width="70"
          height="70"
          loading="lazy"
        />
      </picture>
      <h2 class="work-together-title">
        Let’s <span class="theme">work</span><br />
        together
      </h2>
    </div>

    <form class="work-together-form">
      <div class="work-together-field">
        <input
          class="work-together-input"
          type="email"
          name="email"
          placeholder="clients@gmail.com"
          pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"
          autocomplete="off"
          required
        />
        <span class="error message">Invalid email, try again</span>
        <span class="success message">Succes!</span>
      </div>
      <div class="work-together-field">
        <input
          class="work-together-input"
          type="text"
          name="comments"
          placeholder="comments"
          autocomplete="off"
          required
        />
      </div>
      <button class="work-together-btn" type="submit">Send</button>
    </form>
    <address class="work-together-contacts">
      <ul class="work-together-list">
        <li class="work-together-item">
          <a class="work-together-link" href="mailto:lloydjefferson@gmail.com"
            >lloydjefferson@gmail.com</a
          >
        </li>
        <li class="work-together-item">
          <a class="work-together-link" href="tel:+3801111111111"
            >+380 11 1111 11 11</a
          >
        </li>
      </ul>
    </address>
    <div class="work-together-backdrop">
      <div class="work-together-modal">
        <button class="work-together-modal-btn" type="button">
          <svg class="work-together-svg" width="18" height="14">
            <use href="/img/icons/icons-sprite.svg#close"></use>
          </svg>
        </button>
        <h3 class="work-together-modal-title">
          Thank you for your interest in cooperation!
        </h3>
        <p class="work-together-modal-text">
          The manager will contact you shortly to discuss further details and
          opportunities for cooperation. Please stay in touch.
        </p>
      </div>
    </div>
  </div>
</section>
